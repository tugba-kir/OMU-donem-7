[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aseton"
version = "1.0.0"
description = "İzopropanol dehidrojenasyonu ile aseton üretim tesisi ön tasarımı (kütle/enerji denkliği, PFD, rapor)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "reportlab", "pypdf", "pillow"]

[project.scripts]
aseton = "aseton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
